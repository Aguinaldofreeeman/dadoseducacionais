<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=resultados_prova_paulista.html">
    <title>Prova Paulista - Resultados</title>
    <link rel="stylesheet" href="css/home-button.css">

    <link rel="stylesheet" href="design/tokens.css">
    <link rel="stylesheet" href="design/app.css">
    <link rel="stylesheet" href="design/pages/provapaulista.css">
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header>
        <h1>Painel Prova Paulista</h1>
        <div class="header-actions">
            <a href="index.html" class="home-button">Início</a>
            <button id="btn-sair" class="btn-logout">Sair</button>
        </div>
    </header>
    <main id="conteudo" tabindex="-1">
        <div class="card">
            <h2>Módulo de Indicadores da Prova Paulista</h2>
            <p>Acesse abaixo a consulta de resultados por unidade escolar, turma, disciplina, participação e aproveitamento:</p>

            <a href="resultados_prova_paulista.html" class="btn-action">Acessar Resultados Detalhados &rarr;</a>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

    // Página intermediária desativada: segue direto para os resultados
    window.location.replace('resultados_prova_paulista.html');

    // Proteção de rota não autenticada
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
        }
    }
    verificarSessao();

    document.getElementById('btn-sair').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
