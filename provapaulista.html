<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Paulista - Painel do Módulo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .btn-nav { background-color: #0d9488; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
        .btn-nav:hover { background-color: #0f766e; }
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        main { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .card h2 { margin-top: 0; color: #17365d; font-size: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .card p { font-size: 14px; color: #64748b; line-height: 1.6; }

        .btn-action { display: inline-block; background-color: #0284c7; color: white; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; margin-top: 15px; }
        .btn-action:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <header>
        <h1>Painel Prova Paulista</h1>
        <div class="header-actions">
            <a href="index.html" class="btn-nav">Início</a>
            <button id="btn-sair" class="btn-logout">Sair</button>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Módulo de Indicadores da Prova Paulista</h2>
            <p>Acesse abaixo a consulta de resultados por unidade escolar, turma, disciplina, participação e aproveitamento:</p>
            
            <a href="resultados_prova_paulista.html" class="btn-action">Acessar Resultados Detalhados &rarr;</a>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

    // Proteção de rota não autenticada
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
        }
    }
    verificarSessao();

    document.getElementById('btn-sair').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
