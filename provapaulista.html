<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=resultados_prova_paulista.html">
    <title>Prova Paulista - Resultados</title>

    <script>
try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
</script>
<link rel="stylesheet" href="design/tokens.css">
    <link rel="stylesheet" href="design/app.css">
    <link rel="stylesheet" href="design/pages/provapaulista.css">
<script src="design/theme.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="page-header">
  <div class="page-header__inner">
    <div>
      <h1 class="page-header__title">Painel Prova Paulista</h1>
    </div>
    <div class="page-header__actions">
      <button class="btn btn--on-brand theme-toggle" id="btnTheme" type="button" title="Ativar tema escuro" aria-label="Ativar tema escuro" aria-pressed="false"><svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Tema</span></button>
      <a class="home-button" href="index.html">Início</a>
      <button id="btn-sair" class="btn-logout">Sair</button>
    </div>
  </div>
</header>
    <main id="conteudo" tabindex="-1">
        <div class="card">
            <h2>Módulo de Indicadores da Prova Paulista</h2>
            <p>Acesse abaixo a consulta de resultados por unidade escolar, turma, disciplina, participação e aproveitamento:</p>

            <a href="resultados_prova_paulista.html" class="btn-action">Acessar Resultados Detalhados &rarr;</a>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

    // Página intermediária desativada: segue direto para os resultados
    window.location.replace('resultados_prova_paulista.html');

    // Proteção de rota não autenticada
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
        }
    }
    verificarSessao();

    document.getElementById('btn-sair').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
