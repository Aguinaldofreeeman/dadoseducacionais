
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - Plataforma Educacional</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px; text-align: center; }
        main { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 16px; background-color: #17365d; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Painel Administrativo</h1>
    </header>
    <main>
        <h2>Gestão da Plataforma</h2>
        <p id="status-carregamento">A verificar permissões de acesso...</p>
        <div id="conteudo-admin" style="display: none;">
            <p>Bem-vindo à área restrita de administração.</p>
            <h3>Utilizadores Registados</h3>
<table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%; margin-bottom: 20px; text-align: left;">
    <thead>
        <tr style="background-color: #17365d; color: white;">
            <th>E-mail</th>
            <th>Perfil (Role)</th>
            <th>Data de Criação</th>
        </tr>
    </thead>
    <tbody id="tabela-utilizadores">
        <tr><td colspan="3">A carregar utilizadores...</td></tr>
    </tbody>
</table>
            <button id="btn-voltar" onclick="window.location.href='resultados.html'">Voltar aos Resultados</button>
        </div>
    </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://hygvdaixsqogcmcolnyx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RwMK19Fa7ZekiGB4uQxV5Q_QEcL6W0P';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Função global para atualizar o perfil do utilizador
    window.alterarPerfil = async (userId, novaRole) => {
        const { error } = await supabaseClient
            .from('profiles')
            .update({ role: novaRole })
            .eq('id', userId);

        if (error) {
            alert('Erro ao atualizar perfil: ' + error.message);
        } else {
            alert('Perfil atualizado com sucesso!');
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Verifica se existe sessão ativa
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
            return;
        }

        // 2. Consulta o perfil na tabela profiles
        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role')
            .eq('id', session.user.id)
            .single();

        // 3. Bloqueia acessos de utilizadores comuns
        if (!profile || profile.role !== 'admin') {
            alert('Acesso negado: Apenas administradores podem aceder a esta página.');
            window.location.href = 'resultados.html';
            return;
        }

        // 4. Exibe o conteúdo exclusivo de administrador
        document.getElementById('status-carregamento').style.display = 'none';
        document.getElementById('conteudo-admin').style.display = 'block';

        // 5. Consulta todos os perfis registados incluindo o ID
        const { data: utilizadores, error: erroUtilizadores } = await supabaseClient
            .from('profiles')
            .select('id, email, role, created_at');

        const tabela = document.getElementById('tabela-utilizadores');

        if (erroUtilizadores) {
            console.error('Erro ao carregar utilizadores:', erroUtilizadores.message);
            tabela.innerHTML = '<tr><td colspan="3">Erro ao carregar lista de utilizadores.</td></tr>';
        } else if (utilizadores && utilizadores.length > 0) {
            tabela.innerHTML = utilizadores.map(u => `
                <tr>
                    <td>${u.email || 'N/D'}</td>
                    <td>
                        <select onchange="alterarPerfil('${u.id}', this.value)" ${u.id === session.user.id ? 'disabled' : ''}>
                            <option value="usuario" ${u.role === 'usuario' ? 'selected' : ''}>usuario</option>
                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
                        </select>
                    </td>
                    <td>${new Date(u.created_at).toLocaleDateString('pt-PT')}</td>
                </tr>
            `).join('');
        } else {
            tabela.innerHTML = '<tr><td colspan="3">Nenhum utilizador encontrado.</td></tr>';
        }
    });
</script>


    
</body>
</html>
