<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - Prova Paulista</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        main { padding: 30px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        
        /* Formulário de Usuário */
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 18px; color: #17365d; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { border-color: #0d9488; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; margin-bottom: 20px; }
        .checkbox-group input { width: 16px; height: 16px; cursor: pointer; }
        .checkbox-group label { font-size: 14px; font-weight: normal; color: #334155; cursor: pointer; }
        
        .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-cancel { background: white; border: 1px solid #cbd5e1; color: #0d9488; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-save { background: #0d9488; border: none; color: white; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-save:hover { background: #0f766e; }
        .btn-save:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; word-break: break-word; }
        .msg.success { background-color: #d1fae5; color: #065f46; display: block; border: 1px solid #a7f3d0; }
        .msg.error { background-color: #fee2e2; color: #991b1b; display: block; border: 1px solid #fca5a5; }
    </style>
</head>
<body>
    <header>
        <h1>Área Administrativa — Prova Paulista</h1>
        <button id="btn-sair" class="btn-logout">Sair</button>
    </header>
    <main>
        <!-- Card Novo Usuário -->
        <div class="card">
            <div class="modal-header">
                <h3>Novo usuário</h3>
                <button class="close-btn" type="button" onclick="document.getElementById('form-novo-usuario').reset()">&times;</button>
            </div>
            <form id="form-novo-usuario">
                <div class="form-group">
                    <label for="usr-nome">Nome</label>
                    <input type="text" id="usr-nome" placeholder="Nome do usuário" required>
                </div>
                <div class="form-group">
                    <label for="usr-email">E-mail</label>
                    <input type="email" id="usr-email" placeholder="exemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="usr-senha">Senha</label>
                    <input type="password" id="usr-senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="usr-funcao">Função</label>
                    <select id="usr-funcao">
                        <option value="">Sem função definida</option>
                        <option value="Coordenador">Coordenador</option>
                        <option value="Diretor">Diretor</option>
                        <option value="Professor">Professor</option>
                        <option value="Analista">Analista Educacional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="usr-escopo">Escopo</label>
                    <select id="usr-escopo">
                        <option value="USER" selected>USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="usr-ativo" checked>
                    <label for="usr-ativo">Usuário ativo</label>
                </div>
                
                <div id="usr-msg" class="msg"></div>

                <div class="actions">
                    <button type="button" class="btn-cancel" onclick="document.getElementById('form-novo-usuario').reset()">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="btn-save">Salvar</button>
                </div>
            </form>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://hygvdaixsqogcmcolnyx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RwMK19Fa7ZekiGB4uQxV5Q_QEcL6W0P';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Proteção de rota não autenticada
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
        }
    }
    verificarSessao();

    document.getElementById('btn-sair').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });

    // Cadastro de Novo Usuário com Perfil Estendido
    document.getElementById('form-novo-usuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById('usr-msg');
        const btnSalvar = document.getElementById('btn-salvar');
        
        msgEl.className = 'msg';
        msgEl.style.display = 'none';
        btnSalvar.disabled = true;
        btnSalvar.textContent = 'Salvando...';

        const nome = document.getElementById('usr-nome').value.trim();
        const email = document.getElementById('usr-email').value.trim();
        const senha = document.getElementById('usr-senha').value.trim();
        const funcao = document.getElementById('usr-funcao').value;
        const escopo = document.getElementById('usr-escopo').value;
        const ativo = document.getElementById('usr-ativo').checked;

        try {
            // Cliente temporário totalmente isolado para registrar a conta sem deslogar o administrador
            const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
                auth: { 
                    persistSession: false,
                    autoRefreshToken: false,
                    detectSessionInUrl: false,
                    storageKey: 'sb-temp-auth-token'
                }
            });

            const { data: authData, error: authError } = await tempClient.auth.signUp({
                email: email,
                password: senha
            });

            if (authError) throw authError;

            if (authData.user) {
                if (authData.user.identities && authData.user.identities.length === 0) {
                    throw new Error('Este e-mail já está cadastrado no sistema.');
                }

                // Inserir perfil estendido na tabela perfis_usuarios com a sessão do Admin
                const { error: profileError } = await supabaseClient
                    .from('perfis_usuarios')
                    .insert([{
                        id: authData.user.id,
                        nome: nome,
                        email: email,
                        funcao: funcao,
                        escopo: escopo,
                        ativo: ativo
                    }]);

                if (profileError) throw profileError;

                msgEl.textContent = `Usuário ${nome} (${email}) cadastrado com sucesso!`;
                msgEl.className = 'msg success';
                document.getElementById('form-novo-usuario').reset();
                document.getElementById('usr-ativo').checked = true;
            }
        } catch (err) {
            console.error('Erro no cadastro:', err);
            msgEl.textContent = `Erro ao cadastrar usuário: ${err.message || err}`;
            msgEl.className = 'msg error';
        } finally {
            btnSalvar.disabled = false;
            btnSalvar.textContent = 'Salvar';
        }
    });
</script>
</body>
</html>
