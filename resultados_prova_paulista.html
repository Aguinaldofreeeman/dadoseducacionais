<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Prova Paulista</title>
    <link rel="stylesheet" href="css/home-button.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.8; }
        main { padding: 30px; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .filters { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-weight: bold; font-size: 13px; }
        .filter-group select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 14px; min-width: 200px; }
        .btn-admin { background-color: #17365d; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 100%; }
        table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 13px; text-align: center; }
        th { background-color: #17365d; color: white; padding: 12px 10px; font-weight: 600; border-bottom: 2px solid #0f243f; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #edf2f7; }
        tr.linha-total { background-color: #e2e8f0; font-weight: bold; border-top: 2px solid #17365d; }
        td:first-child, th:first-child { text-align: left; font-weight: 600; padding-left: 15px; position: sticky; left: 0; background-color: #fff; z-index: 1; }
        tr:nth-child(even) td:first-child { background-color: #f8fafc; }
        tr.linha-total td:first-child { background-color: #e2e8f0; }
        th:first-child { background-color: #17365d; z-index: 2; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Resultados — Prova Paulista</h1>
            <p>Plataforma de Consulta Educacional</p>
        </div>
        <div class="header-actions">
            <a href="index.html" class="home-button">Início</a>
            <a href="dashboard.html" class="btn-admin" style="background-color:#0d9488;">Dashboard Prova Paulista</a>
            <a href="admin.html" class="btn-admin">Área Administrativa</a>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="filters">
                <div class="filter-group">
                    <label for="select-ano">Ano Letivo:</label>
                    <select id="select-ano"></select>
                </div>
                <div class="filter-group">
                    <label for="select-edicao">Bimestre / Edição da Prova:</label>
                    <select id="select-edicao"></select>
                </div>
                <div class="filter-group">
                    <label for="select-escola">Filtrar Escola:</label>
                    <select id="select-escola">
                        <option value="">Todas as Escolas</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead id="cabecalho-tabela">
                    <tr><th>Escola</th></tr>
                </thead>
                <tbody id="tabela-resultados">
                    <tr><td>Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

    // Mapeamento de todas as colunas possíveis
    const colunasDef = [
        { chave: 'escola', titulo: 'Escola', sempreVisivel: true },
        { chave: 'participacao', titulo: '(%) Partic' },
        { chave: 'acertos_prova', titulo: '(%) Acerto' },
        { chave: 'evolucao', titulo: '*Evolução' },
        { chave: 'port', titulo: 'PORT' },
        { chave: 'mat', titulo: 'MAT' },
        { chave: 'his', titulo: 'HIS' },
        { chave: 'geo', titulo: 'GEO' },
        { chave: 'bio', titulo: 'BIO' },
        { chave: 'qui', titulo: 'QUI' },
        { chave: 'ing', titulo: 'ING' },
        { chave: 'cie', titulo: 'CIE' },
        { chave: 'fis', titulo: 'FIS' },
        { chave: 'ed_fin', titulo: 'ED FIN' },
        { chave: 'emp', titulo: 'EMP' },
        { chave: 'art', titulo: 'ART' },
        { chave: 'lide', titulo: 'LIDE' },
        { chave: 'oratoria', titulo: 'ORATÓRIA' },
        { chave: 'geo_pol', titulo: 'GEO POL' },
        { chave: 'filo', titulo: 'FILO' },
        { chave: 'soc', titulo: 'SOC' },
        { chave: 'bio_tec', titulo: 'TEC' },
        { chave: 'quim_apl', titulo: 'QUIM APL' }
    ];

    function formatarPercentual(val) {
        if (val === null || val === undefined || String(val).trim() === '' || String(val).trim() === '-') return '-';
        let str = String(val).trim().replace(',', '.');
        if (str.endsWith('%')) {
            str = str.slice(0, -1).trim();
        }
        let num = parseFloat(str);
        if (isNaN(num)) return val;
        if (num > 0 && num <= 1) {
            num = num * 100;
        }
        return num.toFixed(1).replace('.', ',') + '%';
    }

    // Proteção de rota não autenticada
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'index.html';
            return false;
        }
        return true;
    }

    // A visão consolidada (uma linha por escola/edição) é usada quando existe no banco.
    // Sem ela, a consulta cai na tabela bruta e a consolidação acontece no navegador.
    let fonteDadosCache = null;

    async function detectarFonteDados() {
        if (fonteDadosCache) return fonteDadosCache;
        const { error } = await supabaseClient
            .from('vw_resultados_consolidados')
            .select('ano')
            .limit(1);

        fonteDadosCache = error ? 'dados_educacionais' : 'vw_resultados_consolidados';
        return fonteDadosCache;
    }

    async function carregarFiltros() {
        const { data, error } = await supabaseClient
            .from('edicoes_disponiveis')
            .select('ano, edicao_planilha');

        if (error || !data || data.length === 0) {
            document.getElementById('tabela-resultados').innerHTML = '<tr><td>Nenhum dado encontrado no banco.</td></tr>';
            return;
        }

        // Anos disponíveis (normalizados para texto, do mais recente para o mais antigo)
        const anos = [...new Set(data.map(d => d.ano).filter(a => a !== null && a !== undefined).map(a => String(a)))]
            .sort((a, b) => b.localeCompare(a, 'pt-BR', { numeric: true }));

        const selectAno = document.getElementById('select-ano');
        selectAno.innerHTML = '<option value="">Todos os anos</option>' +
            anos.map(a => `<option value="${a}">${a}</option>`).join('');

        // Começa no ano mais recente, mantendo o comportamento anterior
        if (anos.length > 0) {
            selectAno.value = anos[0];
        }

        const atualizarEdicoes = () => {
            const anoSel = selectAno.value;
            let edicoes = [...new Set(data
                .filter(d => !anoSel || String(d.ano) === anoSel)
                .map(d => d.edicao_planilha)
                .filter(Boolean))];
            
            // 1. Ordenar as edições sequencialmente (1º bim, 2º bim, 3º bim, etc.)
            edicoes.sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true, sensitivity: 'base' }));

            // 2. Montar as opções removendo a extensão .xlsx ou .xls do texto visível
            const selectEdicao = document.getElementById('select-edicao');
            const edicaoAtual = selectEdicao.value;
            selectEdicao.innerHTML = edicoes.map(e => {
                const nomeExibicao = e.replace(/\.xlsx?$/i, '');
                return `<option value="${e}">${nomeExibicao}</option>`;
            }).join('');

            // Mantém a edição selecionada quando ela continuar disponível
            if (edicaoAtual && edicoes.includes(edicaoAtual)) {
                selectEdicao.value = edicaoAtual;
            }

            carregarTabela();
        };

        selectAno.addEventListener('change', atualizarEdicoes);
        document.getElementById('select-edicao').addEventListener('change', carregarTabela);
        document.getElementById('select-escola').addEventListener('change', carregarTabela);

        atualizarEdicoes();
    }

    async function carregarTabela() {
        const ano = document.getElementById('select-ano').value;
        const edicao = document.getElementById('select-edicao').value;
        const thead = document.getElementById('cabecalho-tabela');
        const tbody = document.getElementById('tabela-resultados');

        if (!edicao) {
            tbody.innerHTML = '<tr><td>Selecione a edição da prova.</td></tr>';
            return;
        }

        tbody.innerHTML = '<tr><td>Carregando registros...</td></tr>';

        // Com ano selecionado filtra pelo ano; com "Todos os anos" busca todas as edições
        // Usa a visão consolidada quando ela existe (evita o limite de 1000 linhas do PostgREST)
        const fonte = await detectarFonteDados();
        let query = supabaseClient.from(fonte).select('*');
        if (ano) {
            query = query.eq('ano', ano);
        }
        const { data, error } = await query
            .eq('edicao_planilha', edicao)
            .order('escola', { ascending: true })
            .range(0, 9999);

        if (error) {
            tbody.innerHTML = `<tr><td>Erro ao carregar dados: ${error.message}</td></tr>`;
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td>Nenhum registro encontrado para este filtro.</td></tr>';
            return;
        }

        // 1. Filtrar e remover linhas de metadados da planilha
        const linhasValidas = data.filter(r => {
            const esc = (r.escola || '').toUpperCase();
            if (esc.trim() === '') return false;
            return !esc.includes('FILTROS APLICADOS') && !esc.includes('CD_DIRETORIA') && !esc.includes('NM_DIRETORIA');
        });

        // 2. Atualizar o dropdown de escolas
        const selectEscola = document.getElementById('select-escola');
        const escolaSelecionada = selectEscola.value;

        const listaEscolas = [...new Set(linhasValidas
            .map(r => r.escola ? r.escola.trim() : '')
            .filter(e => e && !e.toUpperCase().startsWith('TOTAL'))
        )].sort();

        selectEscola.innerHTML = '<option value="">Todas as Escolas</option>' +
            listaEscolas.map(e => `<option value="${e}" ${e === escolaSelecionada ? 'selected' : ''}>${e}</option>`).join('');

        // 3. Agrupar os registros por escola
        const escolasAgrupadas = {};
        linhasValidas.forEach(r => {
            const nomeEscola = r.escola ? r.escola.trim() : 'ESCOLA SEM NOME';
            
            if (escolaSelecionada && nomeEscola !== escolaSelecionada && !nomeEscola.toUpperCase().startsWith('TOTAL')) {
                return;
            }

            if (!escolasAgrupadas[nomeEscola]) {
                escolasAgrupadas[nomeEscola] = [];
            }
            escolasAgrupadas[nomeEscola].push(r);
        });

        const camposDisciplinas = [
            'participacao', 'acertos_prova', 'evolucao', 'port', 'mat', 
            'his', 'geo', 'bio', 'qui', 'ing', 'cie', 'fis', 
            'ed_fin', 'emp', 'art', 'lide', 'oratoria', 'geo_pol', 
            'filo', 'soc', 'bio_tec', 'quim_apl'
        ];

        // 4. Ordenar para colocar a linha Total no final
        const nomesEncontrados = Object.keys(escolasAgrupadas);
        const escolasNormais = nomesEncontrados.filter(e => !e.toUpperCase().startsWith('TOTAL')).sort();
        const escolasTotal = nomesEncontrados.filter(e => e.toUpperCase().startsWith('TOTAL'));
        const ordemFinal = [...escolasNormais, ...escolasTotal];

        // Consolida os registros duplicados da mesma escola: usa a linha mais completa
        // e, para cada coluna, completa com o primeiro registro que tenha valor
        const valorDe = (registro, campo) => {
            if (!registro) return null;
            if (campo === 'filo') return registro.filo || registro.fil_e_soc_mod;
            return registro[campo];
        };

        const temValor = (valor) => valor !== null && valor !== undefined &&
            String(valor).trim() !== '' && String(valor).trim() !== '-';

        const completude = (registro) => camposDisciplinas.reduce((acc, campo) =>
            acc + (temValor(valorDe(registro, campo)) ? 1 : 0), 0);

        const linhasConsolidadas = ordemFinal.map(nomeEscola => {
            const registros = escolasAgrupadas[nomeEscola];
            const principal = [...registros].sort((a, b) => {
                const diferenca = completude(b) - completude(a);
                if (diferenca !== 0) return diferenca;
                return String(b.created_at || '').localeCompare(String(a.created_at || ''));
            })[0];

            const escolaObj = { escola: nomeEscola, ehTotal: nomeEscola.toUpperCase().startsWith('TOTAL') };

            camposDisciplinas.forEach(campo => {
                let valor = valorDe(principal, campo);

                if (!temValor(valor)) {
                    for (const registro of registros) {
                        const alternativo = valorDe(registro, campo);
                        if (temValor(alternativo)) {
                            valor = alternativo;
                            break;
                        }
                    }
                }

                escolaObj[campo] = temValor(valor) ? formatarPercentual(valor) : '-';
            });

            return escolaObj;
        });

        // 5. Identificar dinamicamente quais colunas possuem dados reais para exibir
        const colunasAtivas = colunasDef.filter(col => {
            if (col.sempreVisivel) return true;
            return linhasConsolidadas.some(linha => {
                const val = linha[col.chave];
                return val !== undefined && val !== null && String(val).trim() !== '' && String(val).trim() !== '-';
            });
        });

        // 6. Montar o cabeçalho dinâmico
        thead.innerHTML = `<tr>${colunasAtivas.map(c => `<th>${c.titulo}</th>`).join('')}</tr>`;

        // 7. Montar o corpo da tabela apenas com as colunas ativas
        tbody.innerHTML = linhasConsolidadas.map(r => `
            <tr class="${r.ehTotal ? 'linha-total' : ''}">
                ${colunasAtivas.map(c => `<td>${r[c.chave]}</td>`).join('')}
            </tr>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const autenticado = await verificarSessao();
        if (autenticado) {
            carregarFiltros();
        }
    });
</script>
</body>
</html>
