<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Prova Paulista</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.8; }
        main { padding: 30px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .filters { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-weight: bold; font-size: 13px; }
        .filter-group select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 14px; min-width: 180px; }
        .btn-admin { background-color: #17365d; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th { background-color: #17365d; color: white; padding: 12px 10px; font-weight: 600; border-bottom: 2px solid #0f243f; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #edf2f7; }
        td:first-child, th:first-child { text-align: left; font-weight: 600; padding-left: 15px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Resultados — Prova Paulista</h1>
            <p>Plataforma de Consulta Educacional</p>
        </div>
        <a href="admin.html" class="btn-admin">Área Administrativa</a>
    </header>
    <main>
        <div class="card">
            <h2>Resultados Educacionais Publicados</h2>
            <div class="filters">
                <div class="filter-group">
                    <label for="select-ano">Ano Letivo:</label>
                    <select id="select-ano"></select>
                </div>
                <div class="filter-group">
                    <label for="select-edicao">Bimestre / Edição da Prova:</label>
                    <select id="select-edicao"></select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Escola</th>
                        <th>(%) Partic</th>
                        <th>(%) Acerto</th>
                        <th>*Evolução</th>
                        <th>PORT</th>
                        <th>MAT</th>
                        <th>HIS</th>
                        <th>GEO</th>
                        <th>BIO</th>
                        <th>QUI</th>
                        <th>ING</th>
                        <th>CIE</th>
                        <th>FIS</th>
                        <th>ED FIN</th>
                        <th>GEO POL</th>
                        <th>BIO TEC</th>
                    </tr>
                </thead>
                <tbody id="tabela-resultados">
                    <tr><td colspan="16">A carregar dados...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://hygvdaixsqogcmcolnyx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RwMK19Fa7ZekiGB4uQxV5Q_QEcL6W0P';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const formatarValor = (val) => {
        if (val === null || val === undefined || String(val).trim() === '' || String(val).trim() === '-') return '-';
        const v = String(val).trim();
        if (v.includes('%')) return v;
        const num = parseFloat(v.replace(',', '.'));
        return !isNaN(num) ? `${v}%` : v;
    };

    async function carregarFiltros() {
        const { data, error } = await supabaseClient
            .from('dados_educacionais')
            .select('ano, edicao_planilha');

        if (error || !data || data.length === 0) {
            document.getElementById('tabela-resultados').innerHTML = '<tr><td colspan="16">Nenhum dado encontrado no banco.</td></tr>';
            return;
        }

        const anos = [...new Set(data.map(d => d.ano).filter(Boolean))].sort().reverse();
        const selectAno = document.getElementById('select-ano');
        selectAno.innerHTML = anos.map(a => `<option value="${a}">${a}</option>`).join('');

        const atualizarEdicoes = () => {
            const anoSel = selectAno.value;
            const edicoes = [...new Set(data.filter(d => d.ano === anoSel).map(d => d.edicao_planilha).filter(Boolean))];
            const selectEdicao = document.getElementById('select-edicao');
            selectEdicao.innerHTML = edicoes.map(e => `<option value="${e}">${e}</option>`).join('');
            carregarTabela();
        };

        selectAno.addEventListener('change', atualizarEdicoes);
        document.getElementById('select-edicao').addEventListener('change', carregarTabela);

        atualizarEdicoes();
    }

    async function carregarTabela() {
        const ano = document.getElementById('select-ano').value;
        const edicao = document.getElementById('select-edicao').value;
        const tbody = document.getElementById('tabela-resultados');

        if (!ano || !edicao) {
            tbody.innerHTML = '<tr><td colspan="16">Selecione o ano e a edição.</td></tr>';
            return;
        }

        tbody.innerHTML = '<tr><td colspan="16">A carregar registos...</td></tr>';

        const { data, error } = await supabaseClient
            .from('dados_educacionais')
            .select('*')
            .eq('ano', ano)
            .eq('edicao_planilha', edicao)
            .order('escola', { ascending: true });

        if (error) {
            tbody.innerHTML = `<tr><td colspan="16">Erro ao carregar dados: ${error.message}</td></tr>`;
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="16">Nenhum registo encontrado para este filtro.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(r => `
            <tr>
                <td>${r.escola || '-'}</td>
                <td>${formatarValor(r.participacao)}</td>
                <td>${formatarValor(r.acertos_prova)}</td>
                <td>${formatarValor(r.evolucao)}</td>
                <td>${formatarValor(r.port)}</td>
                <td>${formatarValor(r.mat)}</td>
                <td>${formatarValor(r.his)}</td>
                <td>${formatarValor(r.geo)}</td>
                <td>${formatarValor(r.bio)}</td>
                <td>${formatarValor(r.qui)}</td>
                <td>${formatarValor(r.ing)}</td>
                <td>${formatarValor(r.cie)}</td>
                <td>${formatarValor(r.fis)}</td>
                <td>${formatarValor(r.ed_fin)}</td>
                <td>${formatarValor(r.geo_pol)}</td>
                <td>${formatarValor(r.bio_tec)}</td>
            </tr>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', carregarFiltros);
</script>
</body>
</html>
