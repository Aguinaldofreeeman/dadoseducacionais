

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados — Prova Paulista</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #243247;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        h1 { color: #17365d; }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dce4ee;
            white-space: nowrap;
        }

        th {
            background: #17365d;
            color: white;
        }

        tr:nth-child(even) { background: #f7f9fc; }

        #mensagem { margin: 16px 0; }

        button {
            padding: 10px 16px;
            background: #17365d;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <h1>Resultados — Prova Paulista</h1>
    <p>Resultados publicados disponíveis para sua conta autenticada.</p>

  <button id="btn-admin" style="display: none; padding: 10px 14px; background: #d97706; color: white; border: 0; border-radius: 6px; cursor: pointer; margin-left: 10px;">
    Área Administrativa
</button>
    <p id="mensagem" role="status" aria-live="polite">Verificando autenticação...</p>

    <div class="tabela-container">
        <table>
           <thead>
    <tr>
        <th>Escola</th>
        <th>Participação</th>
        <th>Acertos Prova</th>
        <th>PORT</th>
        <th>MAT</th>
        <th>HIS</th>
        <th>GEO</th>
    </tr>
</thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
    // 1. Verifica se existe uma sessão ativa no Supabase
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        // Se não houver sessão ativa, redireciona para a página de login
        window.location.href = 'index.html';
        return;
    }

// Consulta a função do utilizador na tabela profiles
const { data: profile } = await supabaseClient
    .from('profiles')
    .select('role')
    .eq('id', session.user.id)
    .single();

// Se for administrador, exibe o botão administrativo
if (profile && profile.role === 'admin') {
    const btnAdmin = document.getElementById('btn-admin');
    if (btnAdmin) {
        btnAdmin.style.display = 'inline-block';
        btnAdmin.addEventListener('click', () => {
            window.location.href = 'admin.html';
        });
    }
}


        
    // Código existente para carregar os resultados da Prova Paulista...
});
    const SUPABASE_URL = 'https://hygvdaixsqogcmcolnyx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RwMK19Fa7ZekiGB4uQxV5Q_QEcL6W0P';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById('btn-voltar').addEventListener('click', () => {
        window.location.href = '/';
    });

    async function carregarResultados() {
        const mensagem = document.getElementById('mensagem');
        const corpo = document.getElementById('corpo-tabela');

        const { data: sessaoData, error: erroSessao } =
            await supabaseClient.auth.getSession();

        if (erroSessao || !sessaoData.session) {
            mensagem.textContent = 'Faça login na página inicial para consultar os resultados.';
            return;
        }

        mensagem.textContent = 'Carregando resultados da Prova Paulista 2024...';

        const { data, error } = await supabaseClient
            .from('prova_paulista_1bim_2024')
            .select('escola, participacao, acertos_prova, port, mat, his, geo')
            .limit(100);

        if (error) {
            console.error('Erro ao carregar resultados:', error.message);
            mensagem.textContent = 'Não foi possível carregar os resultados.';
            return;
        }

        if (!data || data.length === 0) {
            mensagem.textContent = 'Nenhum resultado encontrado na base de dados.';
            return;
        }

        corpo.replaceChildren();

        data.forEach(registro => {
            const linha = document.createElement('tr');

            [
                registro.escola,
                registro.participacao ?? '—',
                registro.acertos_prova ?? '—',
                registro.port ?? '—',
                registro.mat ?? '—',
                registro.his ?? '—',
                registro.geo ?? '—'
            ].forEach(valor => {
                const celula = document.createElement('td');
                celula.textContent = valor == null ? '—' : String(valor);
                linha.appendChild(celula);
            });

            corpo.appendChild(linha);
        });

        mensagem.textContent = `${data.length} registo(s) carregado(s).`;
    }

    carregarResultados();
</script>



    
</body>
</html>
