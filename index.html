<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plataforma de Dados Educacionais</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f6fa;
            color: #243247;
        }

        header {
            background-color: #17365d;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 15px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-top: 0;
            color: #17365d;
        }

        .modulos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .modulo {
            padding: 22px;
            border: 1px solid #dce4ee;
            border-radius: 8px;
            background-color: #ffffff;
        }

        .modulo h3 {
            margin-top: 0;
            color: #24558a;
        }

        .modulo p {
            line-height: 1.5;
            color: #536174;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background-color: #e
        }
