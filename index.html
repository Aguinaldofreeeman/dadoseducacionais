<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Dados Educacionais - Prova Paulista</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f6fa; margin: 0; color: #243247; }
        header { background-color: #17365d; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .btn-admin-nav { background-color: #0d9488; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; display: none; }
        .btn-admin-nav:hover { background-color: #0f766e; }
        .btn-alura-nav { background-color: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; display: none; }
        .btn-alura-nav:hover { background-color: #0369a1; }
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        main { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { margin-top: 0; color: #17365d; font-size: 20px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #0d9488; }
        .btn-submit { background-color: #17365d; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0f2744; }
        .msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
        .msg.error { background-color: #fee2e2; color: #991b1b; display: block; border: 1px solid #fca5a5; }
        .user-welcome { font-size: 16px; color: #334155; margin-bottom: 20px; }
        .nav-link-card { display: inline-block; margin-top: 15px; background-color: #0284c7; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .nav-link-card:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <header>
        <h1>Prova Paulista — Dados Educacionais</h1>
        <div class="header-actions">
            <!-- Botão de Acesso aos Resultados da Alura -->
            <a id="btn-alura" href="alura.html" class="btn-alura-nav">Indicadores Alura</a>
            <!-- Botão da Área Administrativa (Exibido apenas para ADM) -->
            <a id="btn-area-admin" href="admin.html" class="btn-admin-nav">Área Administrativa</a>
            <button id="btn-sair" class="btn-logout" style="display: none;">Sair</button>
        </div>
    </header>
    <main>
        <!-- Form de Login (para não autenticados) -->
        <div id="card-login" class="card">
            <h2>Acessar o Sistema</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="seu.email@escola.sp.gov.br" required>
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="Sua senha" required>
                </div>
                <div id="login-msg" class="msg"></div>
                <button type="submit" id="btn-entrar" class="btn-submit">Entrar</button>
            </form>
        </div>

        <!-- Painel de Boas-Vindas (para usuários logados) -->
        <div id="card-painel" class="card" style="display: none;">
            <div id="boas-vindas" class="user-welcome"></div>
            <p>Selecione uma opção de consulta no menu para visualizar os relatórios e indicadores educacionais:</p>
            <a href="alura.html" class="nav-link-card">Acessar Indicadores Alura &rarr;</a>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://hygvdaixsqogcmcolnyx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RwMK19Fa7ZekiGB4uQxV5Q_QEcL6W0P';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const cardLogin = document.getElementById('card-login');
    const cardPainel = document.getElementById('card-painel');
    const btnAlura = document.getElementById('btn-alura');
    const btnAreaAdmin = document.getElementById('btn-area-admin');
    const btnSair = document.getElementById('btn-sair');
    const boasVindasEl = document.getElementById('boas-vindas');

    // Verifica a sessão atual e carrega o perfil do usuário
    async function verificarSessao() {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
            // Consulta as permissões do usuário logado na tabela perfis_usuarios
            const { data: perfil } = await supabaseClient
                .from('perfis_usuarios')
                .select('nome, funcao, escopo, ativo')
                .eq('id', session.user.id)
                .single();

            // Exibe telas padrão de usuário autenticado
            cardLogin.style.display = 'none';
            cardPainel.style.display = 'block';
            btnSair.style.display = 'inline-block';
            btnAlura.style.display = 'inline-block';

            const nomeUsuario = (perfil && perfil.nome) ? perfil.nome : session.user.email;
            const funcaoUsuario = (perfil && perfil.funcao) ? ` (${perfil.funcao})` : '';
            boasVindasEl.textContent = `Olá, ${nomeUsuario}${funcaoUsuario}!`;

            // Oculta totalmente o botão da Área Administrativa para USER
            // Exibe APENAS se for administrador ativo (ADM ou ADMIN)
            if (perfil && perfil.ativo && (perfil.escopo === 'ADM' || perfil.escopo === 'ADMIN')) {
                btnAreaAdmin.style.display = 'inline-block';
            } else {
                btnAreaAdmin.style.display = 'none';
            }
        } else {
            // Caso não esteja logado, oculta os botões e exibe o formulário de login
            cardLogin.style.display = 'block';
            cardPainel.style.display = 'none';
            btnSair.style.display = 'none';
            btnAlura.style.display = 'none';
            btnAreaAdmin.style.display = 'none';
        }
    }

    verificarSessao();

    // Login de Usuário
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-senha').value.trim();
        const msgEl = document.getElementById('login-msg');
        const btnEntrar = document.getElementById('btn-entrar');

        msgEl.style.display = 'none';
        btnEntrar.disabled = true;
        btnEntrar.textContent = 'Entrando...';

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;

            verificarSessao();
        } catch (err) {
            msgEl.textContent = 'Erro ao realizar login: ' + (err.message || 'Credenciais inválidas.');
            msgEl.className = 'msg error';
        } finally {
            btnEntrar.disabled = false;
            btnEntrar.textContent = 'Entrar';
        }
    });

    // Logout
    btnSair.addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        verificarSessao();
    });
</script>
</body>
</html>
