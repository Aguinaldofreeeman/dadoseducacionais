      const atual=selectEscola.value;
      selectEscola.innerHTML='<option value="">Todas as Escolas</option>'+'<option disabled>— Escolas —</option>'+[...E].sort((a,b)=>a.escola.localeCompare(b.escola,'pt-BR')).map(x=>'<option value="'+esc(x.escola)+'">'+esc(x.escola)+'</option>').join('');
      if([...selectEscola.options].some(o=>o.value===atual))selectEscola.value=atual;
      render();
    }
    function render(){
      const E=DATA.escolas,R=DATA.regional;
      const term=q.value.trim().toLowerCase(),alvo=selectEscola.value,st=statusSel.value,crit=ordem.value;
      const a=E.filter(x=>(!alvo||x.escola===alvo)&&(!st||x.status===st)&&x.escola.toLowerCase().includes(term));
      if(crit==='nome')a.sort((x,y)=>x.escola.localeCompare(y.escola,'pt-BR'));
      else a.sort((x,y)=>(y[crit]!=null?y[crit]:-1)-(x[crit]!=null?x[crit]:-1));
      sub.textContent=a.length+' de '+E.length+' unidades · '+(st?ROTULO[st]:'sem filtro de conquista')+' · ordenado por '+(ordem.options[ordem.selectedIndex].text.toLowerCase())+'.';
      rows.innerHTML='<tr class="regional"><td>MARILIA · Regional</td><td>—</td><td class="num">'+nf1(R.nota)+'</td><td class="num">'+nf1(R.metaOuro)+'</td><td class="num">'+nf1(R.metaDiamante)+'</td><td class="num">—</td><td></td></tr>'+a.map(x=>'<tr><td>'+esc(x.escola)+'</td><td><span class="tag '+x.status+'" title="'+esc(TITULO[x.status])+'">'+esc(ROTULO[x.status])+'</span></td><td class="num">'+nf1(x.nota)+'</td><td class="num">'+nf1(x.metaOuro)+'</td><td class="num">'+nf1(x.metaDiamante)+'</td><td class="num">'+(x.pp3bim!=null?pc(x.pp3bim):'—')+'</td><td class="contato">'+esc(x.contato)+'</td></tr>').join('');
    }
    async function carregarSupabase(){
      try{
        const {data:anos,error:erroAno}=await supabaseClient.from('resultados_saresp').select('ano').order('ano',{ascending:false}).limit(1);
        if(erroAno||!anos||!anos.length)return;
        const {data,error}=await supabaseClient.from('resultados_saresp').select('*').eq('ano',anos[0].ano);
        if(error||!data||data.length<15)return;
        DATA=aPartirDeBanco(data);
        rodape.textContent='Fonte: Supabase (resultados_saresp) · ano letivo '+DATA.ano+' · importada via admin.html. Conquista 2025: Ouro = conquistou a meta Ouro · Diamante = conquistou a meta Diamante · N/A = não atingiu a meta 2025 · Sistema·EJA = unidades do sistema EJA multisseriado (classes hospitalares, socioeducativas, penitenciárias e EPF/CEL JTO), fora da classificação regular.';
        inicializar();
      }catch(err){console.warn('Falha ao buscar resultados_saresp:',err.message);}
    }
    q.oninput=render;ordem.onchange=render;statusSel.onchange=render;selectEscola.onchange=render;inicializar();
    (async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='index.html';return;}carregarSupabase();})();
  </script>
</body></html>
